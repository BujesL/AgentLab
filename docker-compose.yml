services:
  postgres:
    # pgvector/pgvector:pg16, not plain postgres:16 — schema.sql runs
    # `CREATE EXTENSION vector` (RAG pipeline) and the extension binary
    # isn't present in the vanilla image.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentlab
      POSTGRES_PASSWORD: agentlab_dev_only
      POSTGRES_DB: agentlab
    ports:
      - "5432:5432"
    volumes:
      - agentlab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentlab -d agentlab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  agentlab_pgdata:
